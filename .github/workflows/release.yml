name: Prepare GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Check release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit merged into master
        run: git merge-base --is-ancestor HEAD origin/master

  build:
    needs: source
    uses: ./.github/workflows/build.yml

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wheels
          path: dist
      - name: Verify wheel checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create draft with tested wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft
          --title "lbry-rocksdb-ng $GITHUB_REF_NAME"
          --notes-file dist/RELEASE_NOTES.md
          dist/wheels/*.whl dist/SHA256SUMS dist/release.json
